<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1119" />
    <title>Offline · Fitness</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f1119;
        color: #f7f7fb;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .card { max-width: 22rem; }
      .icon {
        width: 72px; height: 72px; margin: 0 auto 1.25rem;
        display: flex; align-items: center; justify-content: center;
        border-radius: 999px;
        background: linear-gradient(135deg, #6c63ff, #4b3fe0);
        box-shadow: 0 12px 30px -10px rgba(108, 99, 255, 0.6);
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { color: #a3a3b8; font-size: 0.9rem; line-height: 1.5; margin: 0 0 1.75rem; }
      button {
        appearance: none; border: none; cursor: pointer;
        font: inherit; font-weight: 700; color: #fff;
        padding: 0.85rem 2rem; border-radius: 999px;
        background: linear-gradient(135deg, #6c63ff, #4b3fe0);
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Your workouts and meals are safe — reconnect to the internet and we'll pick up right where you left off.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      // Auto-reload the app as soon as connectivity returns.
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
